[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interpres"
version = "0.1.0-alpha"
description = "An evidence-first, human-in-the-loop translation and textual review pipeline for historical texts."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Fabio Rosado", email = "fabio@example.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.1.0",
    "mypy>=1.5",
]
review = [
    "aiohttp>=3.9",
]
whitakers = [
    "whitakers-words @ git+https://github.com/blagae/whitakers_words.git",
]

[project.scripts]
interpres = "interpres.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["interpres*"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20"]
ignore = ["S101", "T201"]
exclude = [".cache", "artifacts", "data", "dependencies", "__pycache__"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["tests", "scripts", "dependencies"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["*Test"]
python_functions = ["test_*"]
addopts = "-v --tb=short"